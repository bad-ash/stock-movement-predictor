[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-movement-predictor"
version = "0.1.0"
description = "Stock Movement XGBoost + ARIMA (SMX) project"
requires-python = ">=3.10"

authors = [
  { name = "Ashour Badine" }
]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "yfinance>=0.2",
  "pyarrow>=17",
  "mlflow>=2.10",
  "pmdarima>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
