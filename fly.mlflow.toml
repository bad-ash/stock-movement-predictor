app = "smx-mlflow"
primary_region = "ord"

[env]
  MLFLOW_SERVER_ENABLE_JOB_EXECUTION = "false"

[build]
  dockerfile = "Dockerfile.mlflow"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
