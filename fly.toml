app = "stock-movement-predictor"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile.api"

[env]
  PYTHONPATH = "/app/src"
  REGISTERED_MODEL_NAME = "SMX_SPY_XGB"
  MODEL_ALIAS = "champion"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
